# Dex acts as the OIDC provider of the e2e stack.
#
# The issuer is the *browser facing* URL: the test browser resolves `sso` through Chromium's
# --host-resolver-rules, so containers and browser agree on one single URL whatever port
# docker picked. It has to be https because openid-client refuses plain http; the certificate
# is self signed and the browser context is told to ignore it.
issuer: https://sso:5554

storage:
  type: memory

sessions:
  cookieName: 'dex_session'
  absoluteLifetime: '24h'
  validIfNotUsedFor: '12h'
  ssoSharedWithDefault: 'all'

web:
  # https for the browser, plain http for the side service introspection calls
  https: 0.0.0.0:5554
  tlsCert: /etc/dex/tls.crt
  tlsKey: /etc/dex/tls.key
  http: 0.0.0.0:5556
  allowedOrigins:
    - '*'
  logger:
    level: 'info'

staticClients:
  # Public client used by the SPA (PKCE, no secret)
  - id: twake-contacts
    name: 'Twake Contacts'
    public: true
    redirectURIs:
      - 'http://localhost:8099/callback'
    # Dex refuses a logout whose post_logout_redirect_uri is not listed here, compared as an
    # exact string: keep it identical to SSO_POST_LOGOUT_REDIRECT of frontend/env.js
    postLogoutRedirectURIs:
      - 'http://localhost:8099?logout=1'

  # Confidential client the side service uses to introspect access tokens
  - id: tcalendar-side-service
    name: 'Twake Calendar Side Service'
    secret: 'secret123'
    redirectURIs:
      - 'http://api/callback'

# No static account: accounts are created on demand, as LDAP entries, by support/users.ts.
# Dex queries the directory at every login, so a user created a millisecond ago can log in
# and the test suite is not capped by anything written in this file.
enablePasswordDB: false

connectors:
  - type: ldap
    id: ldap
    name: LDAP
    config:
      host: esn_ldap:389
      insecureNoSSL: true
      bindDN: cn=admin,dc=open-paas.org,dc=lng
      bindPW: admin
      usernamePrompt: Email address
      userSearch:
        baseDN: ou=users,dc=open-paas.org,dc=lng
        filter: '(objectClass=inetOrgPerson)'
        username: mail
        idAttr: uid
        emailAttr: mail
        nameAttr: cn

oauth2:
  skipApprovalScreen: true
  responseTypes: ['code']
