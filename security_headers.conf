# Security headers, included in every location: nginx does not inherit add_header into a
# location that defines its own add_header.
#
# frame-ancestors comes from the FRAME_ANCESTORS environment variable of the container
# (default 'self'): the app is embedded by the workplace (cozy-external-bridge), whose origin
# depends on the deployment. X-Frame-Options is not set: it cannot list several origins and
# browsers ignore it when frame-ancestors is present.
add_header Content-Security-Policy "frame-ancestors $frame_ancestors; object-src 'none'; base-uri 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
